allowBuilds:
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

overrides:
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  js-yaml@3: ^3.15.1
  nanoid@3: ^3.3.17
  shell-quote: ^1.10.0

auditConfig:
  ignoreGhsas:
    # GHSA-mh99-v99m-4gvg's vulnerable range is published as "<=5.0.7", which
    # semver-catches the unrelated, unaffected 1.x/2.x brace-expansion lines
    # (e.g. 1.1.18) alongside the real >=5.x issue. The 1.x/2.x/5.x lines here
    # are already pinned to their own patched versions via the overrides above.
    - GHSA-mh99-v99m-4gvg
