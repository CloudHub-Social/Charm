name: Create Release PR

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Detect release branch merge
        id: release-merge
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          first_line="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$first_line" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\ CloudHub-Social/(release|release-candidate-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+)$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate bot token
        id: generate-token
        if: steps.release-merge.outputs.skip != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release-merge.outputs.skip != 'true'
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.generate-token.outputs.token }}

      - name: Preserve existing release work
        if: steps.release-merge.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { assertNoRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-release.mjs`);
            await assertNoRelease({ github, context });

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.release-merge.outputs.skip != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release-merge.outputs.skip != 'true'
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install release tooling
        if: steps.release-merge.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.release-merge.outputs.skip != 'true'
        with:
          version: 0.22.3

      - name: Prepare Release
        id: prepare-release
        if: steps.release-merge.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          output="$(knope prepare-release --verbose 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [[ $status -eq 0 ]]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fq "releases::no_release" <<<"$output"; then
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "No releaseable changes detected; skipping release PR update."
            exit 0
          fi

          exit $status
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Enrich and validate the staged release
        if: steps.release-merge.outputs.skip != 'true' && steps.prepare-release.outputs.prepared == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          node .github/scripts/enrich-changelog.mjs
          pnpm exec oxfmt --write CHANGELOG.md
          git add CHANGELOG.md
          node scripts/sync-android-version-code.mjs --check
          pnpm check:ios-config
          node --test scripts/configure-sideload-ios.test.mjs

      - name: Publish an initially signed draft
        if: steps.release-merge.outputs.skip != 'true' && steps.prepare-release.outputs.prepared == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-release.mjs`);
            const result = await publishRelease({ github, context });
            const { writeFileSync } = await import('node:fs');
            writeFileSync(`${process.env.RUNNER_TEMP}/release-candidate.json`, JSON.stringify(result.receipt));
            core.info(`Prepared ${result.sha}: ${result.url}`);

      - name: Retain exact candidate provenance
        if: steps.release-merge.outputs.skip != 'true' && steps.prepare-release.outputs.prepared == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
