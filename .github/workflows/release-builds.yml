name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Sentry release name. Defaults to the tag name or commit SHA."
        required: false
        type: string
      environment:
        description: "Sentry environment tag for uploaded release artifacts."
        required: false
        default: production
        type: string
      verify_platform_signing:
        description: "On main only: verify signed Android/Windows artifacts; never publish a release."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  signing-policy:
    name: Validate signing verification ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restrict manual signing verification to main
        env:
          VERIFY_SIGNING: ${{ inputs.verify_platform_signing }}
        run: |
          if [ "$VERIFY_SIGNING" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Signing verification must run from reviewed main, not a feature branch or tag."
            exit 1
          fi

      - name: Match release tag to synchronized application version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version=$(jq -r .version package.json)
          tauri_version=$(jq -r .version src-tauri/tauri.conf.json)
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$package_version" != "$tauri_version" ] || [ "$package_version" != "$cargo_version" ]; then
            echo "::error::Application versions are not synchronized (package=$package_version, tauri=$tauri_version, cargo=$cargo_version)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match application version v$package_version"
            exit 1
          fi
          previous_release_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name // ""')
          PREVIOUS_RELEASE_TAG="$previous_release_tag" node scripts/sync-android-version-code.mjs --check

  frontend-sourcemaps:
    needs: signing-policy
    if: ${{ !inputs.verify_platform_signing }}
    name: Frontend sourcemaps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Sentry release upload
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
          ENVIRONMENT_INPUT: ${{ github.event.inputs.environment }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          REQUIRE_VITE_SENTRY_DSN: "true"
          WRITE_FRONTEND_UPLOAD_ENV: "true"
        run: bash .github/scripts/configure-sentry-release-env.sh

      # `vite.config.ts` wires @sentry/vite-plugin when SENTRY_UPLOAD=true and
      # the three Sentry secrets are present. Upload failures fail this build.
      - name: Build and upload frontend sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: pnpm build

      - name: Verify sourcemaps are not left in dist
        run: |
          if find dist -name '*.map' -print -quit | grep -q .; then
            echo "::error::Sentry sourcemap upload left .map files in dist"
            find dist -name '*.map' -print
            exit 1
          fi

      - name: Report frontend bundle sizes
        env:
          SIZE_REPORT_TITLE: Frontend bundle sizes
          SIZE_REPORT_PATHS: dist
          SIZE_REPORT_OUTPUT: .artifacts/sentry-size-analysis/frontend-bundle-sizes.md
        run: node .github/scripts/report-artifact-sizes.mjs

      - name: Upload frontend size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-size-analysis-frontend
          path: .artifacts/sentry-size-analysis/frontend-bundle-sizes.md
          include-hidden-files: true

  rust-linux-debug-files:
    needs: signing-policy
    if: ${{ !inputs.verify_platform_signing }}
    name: Rust Linux debug files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Sentry debug-file upload
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          WRITE_RUST_DEBUG_ENV: "true"
        run: bash .github/scripts/configure-sentry-release-env.sh

      # Stable publication requires packages from this exact source revision,
      # not a nightly artifact. Restrict bundling to the published deb/rpm set.
      # The v0.1.2 bundler hung after RPM creation; keep the build bounded and
      # fail publication on a recurrence rather than uploading a partial set.
      - name: Build Linux release packages with debuginfo
        timeout-minutes: 20
        env:
          # Safe to send straight to the webview build here (unlike the
          # Android job below, which historically kept this unset): the
          # frontend SDK's transport (`instrument.ts`'s
          # `makeTauriIpcTransport`) pipes every envelope through the
          # `forward_sentry_envelope` Tauri command instead of a direct
          # fetch, so the desktop CSP's `connect-src` never needs to allow
          # Sentry's ingest host — see nightly.yml's Linux job for the same
          # wiring. SENTRY_DSN (bare) is read at Rust *runtime* normally, but
          # `option_env!("SENTRY_DSN")` (`BAKED_SENTRY_DSN` in lib.rs) bakes
          # this CI-only value into the binary at compile time, same
          # mechanism as BUILD_ID — see lib.rs's doc comment. VITE_SENTRY_RELEASE
          # reuses the release id "Configure Sentry debug-file upload" above
          # already computed (SENTRY_RELEASE), so this build's frontend
          # events tag the same release the debug-file upload associates
          # symbols with — exported below from the real `$SENTRY_RELEASE`
          # process env var, not via `${{ env.SENTRY_RELEASE }}` (that
          # expression context never sees a prior step's `$GITHUB_ENV`
          # writes, only variables set via an explicit `env:` key — a review
          # bot on PR #228 caught this).
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          VITE_SENTRY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          export VITE_SENTRY_RELEASE="$SENTRY_RELEASE"
          pnpm tauri build --bundles deb,rpm

      - name: Resolve Cargo target directory
        id: cargo-target
        run: |
          target_dir=$(cargo metadata --format-version=1 --no-deps | node -e 'let input=""; process.stdin.on("data", c => input += c); process.stdin.on("end", () => console.log(JSON.parse(input).target_directory));')
          echo "dir=$target_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Rust debug information files
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: >
          pnpm dlx @sentry/cli@3.5.1 debug-files upload
          --org "$SENTRY_ORG"
          --project "$SENTRY_PROJECT"
          --include-sources
          --wait
          --log-level info
          "${{ steps.cargo-target.outputs.dir }}/release"

      - name: Report Linux release artifact sizes
        env:
          SIZE_REPORT_TITLE: Linux release artifact sizes
          SIZE_REPORT_PATHS: ${{ steps.cargo-target.outputs.dir }}/release/charm
          SIZE_REPORT_OUTPUT: .artifacts/sentry-size-analysis/linux-release-sizes.md
        run: node .github/scripts/report-artifact-sizes.mjs

      - name: Export committed source for Linux SBOM
        shell: bash
        run: |
          set -euo pipefail
          sbom_source=$(mktemp -d)
          git archive HEAD | tar -x -C "$sbom_source"
          if [ "$RUNNER_OS" = Windows ]; then
            sbom_source=$(cygpath -m "$sbom_source")
          fi
          printf 'CHARM_SBOM_SOURCE=%s\n' "$sbom_source" >> "$GITHUB_ENV"

      - name: Generate Linux SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.CHARM_SBOM_SOURCE }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: charm-linux.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: |
            ${{ steps.cargo-target.outputs.dir }}/release/bundle/deb/*.deb
            ${{ steps.cargo-target.outputs.dir }}/release/bundle/rpm/*.rpm
            charm-linux.spdx.json
          if-no-files-found: error

      - name: Upload Linux size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-size-analysis-linux
          path: .artifacts/sentry-size-analysis/linux-release-sizes.md
          include-hidden-files: true

  apple-debug-files:
    needs: signing-policy
    if: ${{ !inputs.verify_platform_signing }}
    name: Apple debug files
    runs-on: macos-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Sentry debug-file upload
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          WRITE_RUST_DEBUG_ENV: "true"
        run: bash .github/scripts/configure-sentry-release-env.sh

      - name: Import stable macOS signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_NAME: ${{ secrets.MACOS_CERT_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_CERT_NAME APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::release-signing environment secret $name is required for a stable macOS build"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/release-cert.p12"
          security import "$RUNNER_TEMP/release-cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          IFS=$'\n' read -r -d '' -a existing_keychains < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/' && printf '\0')
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          rm -f "$RUNNER_TEMP/release-cert.p12"
          identity_name=$(printf '%s' "$MACOS_CERT_NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "::add-mask::$identity_name"
          available_identities=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^[[:space:]]*[0-9]*)[[:space:]]*[A-F0-9]*[[:space:]]*"\(.*\)"$/\1/p')
          if [ -z "$identity_name" ] || ! grep -qxF "$identity_name" <<< "$available_identities"; then
            echo "::error::MACOS_CERT_NAME does not match an imported code-signing identity"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity_name" >> "$GITHUB_ENV"

      - name: Build Tauri macOS app with release debuginfo
        env:
          # See the Linux job's Build step comment — same IPC-tunnel wiring
          # (`forward_sentry_envelope`), SENTRY_DSN compile-time baking, and
          # release/environment env, so it's safe to set here too.
          # VITE_SENTRY_RELEASE is exported below from `$SENTRY_RELEASE`
          # rather than set here, for the same `env` context reason.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          VITE_SENTRY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export VITE_SENTRY_RELEASE="$SENTRY_RELEASE"
          pnpm tauri build

      - name: Remove stable macOS signing identity
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          if [ -e "$keychain" ]; then
            security lock-keychain "$keychain"
            security delete-keychain "$keychain"
          fi

      # `pnpm tauri ios build` shells out to `xcodebuild`, and the actual
      # `cargo build` runs inside a generated Xcode "Run Script" build phase
      # (`tauri ios xcode-script`) that does not forward this step's env into
      # it — the same env-forwarding gap nightly.yml's iOS
      # job already documents for sccache. BUILD_ID (written to $GITHUB_ENV
      # by the Sentry config step above) reaches the macOS build fine but
      # would silently be missing for this one, leaving
      # option_env!("BUILD_ID") unset and the Rust Sentry release/build tag
      # falling back to the bare Cargo version. Write it into cargo's own
      # config.toml instead, same as that nightly job, so cargo forwards it
      # to rustc regardless of what env xcodebuild's wrapper process handed
      # down. SENTRY_DSN goes through the same file for the same reason — a
      # review bot on PR #228 caught that VITE_SENTRY_DSN below is opted
      # into for this simulator build, but without this the Rust-side
      # BAKED_SENTRY_DSN (`option_env!("SENTRY_DSN")` in lib.rs) would stay
      # unset here specifically, so an opted-in test run would get the
      # frontend SDK trying to tunnel envelopes to a Rust command that
      # always reports "SENTRY_DSN not configured".
      - name: Persist BUILD_ID/SENTRY_DSN for cargo (xcodebuild doesn't forward step env into its Run Script phase)
        env:
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home"
          config="$cargo_home/config.toml"
          # Guard against a duplicate [env] table (a TOML parse error) in
          # case some earlier step/action already created this file with its
          # own [env] section.
          if [ ! -f "$config" ] || ! grep -q '^\[env\]' "$config"; then
            echo '[env]' >> "$config"
          fi
          echo "BUILD_ID = \"${BUILD_ID}\"" >> "$config"
          if [ -n "$SENTRY_DSN" ]; then
            echo "SENTRY_DSN = \"${SENTRY_DSN}\"" >> "$config"
          fi

      - name: Build Tauri iOS simulator app with debuginfo
        env:
          # This is a simulator debug build for Sentry debug-file upload,
          # not a shipped artifact — but the previous step now also bakes
          # SENTRY_DSN into cargo's config.toml the same way it bakes
          # BUILD_ID, so an opted-in test run of this simulator build can
          # actually round-trip through the IPC tunnel
          # (`forward_sentry_envelope`) instead of failing with "SENTRY_DSN
          # not configured" the way it would if only this VITE_ var were set.
          # VITE_SENTRY_RELEASE/VITE_SENTRY_ENVIRONMENT are exported below
          # from the real process env vars, same reason as every other
          # build step in this file — unlike SENTRY_DSN/BUILD_ID, these are
          # consumed by the Vite build `pnpm tauri ios build` runs directly
          # in *this* step (not inside xcodebuild's nested Run Script), so a
          # plain shell export reaches it fine.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          export VITE_SENTRY_RELEASE="$SENTRY_RELEASE"
          export VITE_SENTRY_ENVIRONMENT="${{ github.event.inputs.environment || 'production' }}"
          pnpm tauri ios build --target aarch64-sim --debug --ci

      - name: Resolve Apple debug-file directories
        id: apple-debug-files
        run: |
          target_dir=$(cargo metadata --format-version=1 --no-deps | node -e 'let input=""; process.stdin.on("data", c => input += c); process.stdin.on("end", () => console.log(JSON.parse(input).target_directory));')
          paths=(
            "$target_dir/release"
            "$target_dir/aarch64-apple-ios-sim/debug"
            "src-tauri/gen/apple/build"
          )
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              existing+=("$path")
            fi
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "::error::No Apple debug-file directories found"
            exit 1
          fi
          {
            echo "paths<<EOF"
            printf '%s\n' "${existing[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "bundle-path=$target_dir/release/bundle" >> "$GITHUB_OUTPUT"

      - name: Upload Apple debug information files
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          DEBUG_FILE_PATHS: ${{ steps.apple-debug-files.outputs.paths }}
        run: |
          paths=()
          while IFS= read -r path; do
            if [ -n "$path" ]; then
              paths+=("$path")
            fi
          done <<< "$DEBUG_FILE_PATHS"
          pnpm dlx @sentry/cli@3.5.1 debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --include-sources \
            --wait \
            --log-level info \
            "${paths[@]}"

      - name: Report Apple build artifact sizes
        env:
          SIZE_REPORT_TITLE: Apple build artifact sizes
          SIZE_REPORT_PATHS: |
            ${{ steps.apple-debug-files.outputs.paths }}
            ${{ steps.apple-debug-files.outputs.bundle-path }}
          SIZE_REPORT_OUTPUT: .artifacts/sentry-size-analysis/apple-build-sizes.md
        run: node .github/scripts/report-artifact-sizes.mjs

      - name: Export committed source for macOS SBOM
        shell: bash
        run: |
          set -euo pipefail
          sbom_source=$(mktemp -d)
          git archive HEAD | tar -x -C "$sbom_source"
          if [ "$RUNNER_OS" = Windows ]; then
            sbom_source=$(cygpath -m "$sbom_source")
          fi
          printf 'CHARM_SBOM_SOURCE=%s\n' "$sbom_source" >> "$GITHUB_ENV"

      - name: Generate macOS SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.CHARM_SBOM_SOURCE }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: charm-macos.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # GPG manifests establish download integrity, not Gatekeeper trust.
      # Keep unsigned diagnostic dispatches available, but fail closed for tags.
      - name: Verify stable macOS signing and notarization
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.apple-debug-files.outputs.bundle-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=("$BUNDLE_PATH"/macos/*.app)
          images=("$BUNDLE_PATH"/dmg/*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#images[@]}" -eq 0 ]; then
            echo "::error::Stable macOS release requires exactly one app and at least one disk image"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
          for image in "${images[@]}"; do
            codesign --verify --strict --verbose=2 "$image"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$image"
            xcrun stapler validate "$image"
          done

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            ${{ steps.apple-debug-files.outputs.bundle-path }}/dmg/*.dmg
            charm-macos.spdx.json
          if-no-files-found: error

      - name: Upload Apple size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-size-analysis-apple
          path: .artifacts/sentry-size-analysis/apple-build-sizes.md
          include-hidden-files: true

  windows-debug-files:
    needs: signing-policy
    name: Windows debug files
    runs-on: windows-latest
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing) && 'release-signing' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Sentry debug-file upload
        shell: bash
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          WRITE_RUST_DEBUG_ENV: "true"
        run: bash .github/scripts/configure-sentry-release-env.sh

      - name: Import stable Windows signing certificate
        if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINDOWS_CERT_PFX -or -not $env:WINDOWS_CERT_PASSWORD) {
            throw 'Stable Windows signing requires WINDOWS_CERT_PFX and WINDOWS_CERT_PASSWORD'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'stable-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            $certs = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey)
            if ($certs.Count -ne 1) { throw 'Expected exactly one Windows signing identity' }
            "WINDOWS_CERT_THUMBPRINT=$($certs[0].Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            Remove-Item -LiteralPath $pfxPath -ErrorAction SilentlyContinue
          }

      - name: Build Tauri Windows app with release debuginfo
        env:
          # See the Linux job's Build step comment — same IPC-tunnel wiring
          # (`forward_sentry_envelope`), SENTRY_DSN compile-time baking, and
          # release/environment env, so it's safe to set here too.
          # VITE_SENTRY_RELEASE is exported below from `$env:SENTRY_RELEASE`
          # (default shell here is pwsh) rather than set here, for the same
          # `env` context reason.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          VITE_SENTRY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $configArgs = @()
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $env:WINDOWS_CERT_THUMBPRINT } } } | ConvertTo-Json -Depth 5 -Compress
            $configPath = Join-Path $env:RUNNER_TEMP 'tauri-stable-signing.json'
            Set-Content -Path $configPath -Value $config -NoNewline -Encoding utf8NoBOM
            $configArgs = @('--config', $configPath)
          }
          $env:VITE_SENTRY_RELEASE = $env:SENTRY_RELEASE
          pnpm tauri build @configArgs

      - name: Resolve Windows debug-file directory
        id: windows-debug-files
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version=1 --no-deps | ConvertFrom-Json
          $releaseDir = Join-Path $metadata.target_directory "release"
          $bundleDir = Join-Path $releaseDir "bundle"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "No Windows release debug-file directory found at $releaseDir"
            exit 1
          }
          "path=$releaseDir" >> $env:GITHUB_OUTPUT
          "bundle-path=$bundleDir" >> $env:GITHUB_OUTPUT

      - name: Verify stable Windows signatures
        if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing
        shell: pwsh
        env:
          RELEASE_DIR: ${{ steps.windows-debug-files.outputs.path }}
          BUNDLE_DIR: ${{ steps.windows-debug-files.outputs.bundle-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path $env:BUNDLE_DIR -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($installers.Count -eq 0) { throw 'No Windows installers to verify' }
          $app = Get-Item -LiteralPath (Join-Path $env:RELEASE_DIR 'charm.exe')
          foreach ($file in (@($app) + $installers)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERT_THUMBPRINT) {
              throw "Invalid or unexpected Windows signer: $($file.Name)"
            }
          }

      - name: Remove imported Windows signing identity
        if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing)
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT" -DeleteKey
          }

      - name: Upload Windows debug information files
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          pnpm dlx @sentry/cli@3.5.1 debug-files upload `
            --org "$env:SENTRY_ORG" `
            --project "$env:SENTRY_PROJECT" `
            --include-sources `
            --wait `
            --log-level info `
            "${{ steps.windows-debug-files.outputs.path }}"

      - name: Report Windows release artifact sizes
        shell: pwsh
        env:
          SIZE_REPORT_TITLE: Windows release artifact sizes
          SIZE_REPORT_PATHS: |
            ${{ steps.windows-debug-files.outputs.path }}
            ${{ steps.windows-debug-files.outputs.bundle-path }}
          SIZE_REPORT_OUTPUT: .artifacts/sentry-size-analysis/windows-release-sizes.md
        run: node .github/scripts/report-artifact-sizes.mjs

      - name: Export committed source for Windows SBOM
        shell: bash
        run: |
          set -euo pipefail
          sbom_source=$(mktemp -d)
          git archive HEAD | tar -x -C "$sbom_source"
          if [ "$RUNNER_OS" = Windows ]; then
            sbom_source=$(cygpath -m "$sbom_source")
          fi
          printf 'CHARM_SBOM_SOURCE=%s\n' "$sbom_source" >> "$GITHUB_ENV"

      - name: Generate Windows SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.CHARM_SBOM_SOURCE }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: charm-windows.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            ${{ steps.windows-debug-files.outputs.bundle-path }}/msi/*.msi
            ${{ steps.windows-debug-files.outputs.bundle-path }}/nsis/*.exe
            charm-windows.spdx.json
          if-no-files-found: error

      - name: Upload Windows size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-size-analysis-windows
          path: .artifacts/sentry-size-analysis/windows-release-sizes.md
          include-hidden-files: true

  android-debug-files:
    needs: signing-policy
    name: Android mapping and native symbols
    runs-on: ubuntu-latest
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing) && 'release-signing' || '' }}
    # Allows every bounded build/upload attempt to report its own failure
    # before GitHub's outer job safety cap takes over.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve Sentry size-analysis base
        id: sentry-size-base
        run: |
          git remote set-head origin --auto
          if git merge-base --is-ancestor HEAD origin/HEAD && git rev-parse --verify HEAD^ >/dev/null; then
            base_sha=$(git rev-parse HEAD^)
          else
            base_sha=$(git merge-base HEAD origin/HEAD)
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - run: pnpm install --frozen-lockfile

      - name: Configure Sentry Android upload
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          WRITE_RUST_DEBUG_ENV: "true"
        run: bash .github/scripts/configure-sentry-release-env.sh

      - name: Import stable Android signing keystore
        if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing
        env:
          ANDROID_KEYSTORE_JKS: ${{ secrets.ANDROID_KEYSTORE_JKS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_JKS:?Missing ANDROID_KEYSTORE_JKS}"
          : "${ANDROID_RELEASE_STORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          keystore_path="$RUNNER_TEMP/stable-signing.keystore"
          printf '%s' "$ANDROID_KEYSTORE_JKS" | base64 --decode > "$keystore_path"
          keytool -exportcert -keystore "$keystore_path" -storepass:env ANDROID_RELEASE_STORE_PASSWORD \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" -file "$RUNNER_TEMP/stable-android-signer.der"
          echo "ANDROID_RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build Android app and prepare mappings/native symbols
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing) && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing) && secrets.ANDROID_KEY_PASSWORD || '' }}
          SENTRY_ANDROID_UPLOAD: "true"
          # Generate and embed Sentry metadata during the build, but keep
          # network uploads out of the already-expensive Android task graph.
          SENTRY_ANDROID_AUTO_UPLOAD: "false"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # The Android WebView frontend SDK's transport
          # (`instrument.ts`'s `makeTauriIpcTransport`) pipes every envelope
          # through the `forward_sentry_envelope` Tauri command instead of a
          # direct fetch — same as the desktop platforms (see the Linux
          # job's Build step comment) — so it's now safe to set VITE_SENTRY_DSN
          # here too, rather than keeping the WebView client disabled.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Reuses the release id "Configure Sentry Android upload" above
          # already computed (SENTRY_RELEASE) — see the Linux job's Build
          # step comment for why this matters (matching the debug-file/
          # mapping upload's release tag), and for why it's exported below
          # from `$SENTRY_RELEASE` rather than set here.
          SENTRY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          VITE_SENTRY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export RANLIB="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          export AR="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export VITE_SENTRY_RELEASE="$SENTRY_RELEASE"
          # Build the generated default Android ABI set so uploaded native symbols
          # match the universal release artifact.
          # Cold four-ABI APK+AAB builds take about 50 minutes on hosted runners.
          timeout --signal=TERM --kill-after=1m 65m pnpm tauri android build --ci

      - name: Verify stable Android signatures
        if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          expected=$(sha256sum "$RUNNER_TEMP/stable-android-signer.der" | cut -d ' ' -f 1)
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f -print0)
          mapfile -d '' bundles < <(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' -type f -print0)
          test "${#apks[@]}" -gt 0
          test "${#bundles[@]}" -gt 0
          for apk in "${apks[@]}"; do
            certificates=$("$apksigner" verify --print-certs "$apk")
            actual=$(printf '%s\n' "$certificates" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
            test "$actual" = "$expected"
          done
          for bundle in "${bundles[@]}"; do
            jarsigner -verify -strict -keystore "$ANDROID_RELEASE_STORE_FILE" \
              -storepass:env ANDROID_RELEASE_STORE_PASSWORD "$bundle" "$ANDROID_RELEASE_KEY_ALIAS"
          done

      - name: Remove imported Android signing material
        if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.verify_platform_signing)
        run: |
          rm -f -- "$RUNNER_TEMP/stable-signing.keystore" "$RUNNER_TEMP/stable-android-signer.der"

      - name: Upload Android mappings and native symbols
        env:
          SENTRY_ANDROID_UPLOAD: "true"
          SENTRY_ANDROID_AUTO_UPLOAD: "true"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          # Signing is complete and its temporary key has been removed. These
          # upload-only Gradle tasks must not configure a stale signing path.
          unset ANDROID_RELEASE_STORE_FILE
          gradle=src-tauri/gen/android/gradlew
          project_dir=src-tauri/gen/android
          tasks=(
            :app:uploadSentryProguardMappingsUniversalRelease
            :app:uploadSentryNativeSymbolsForUniversalRelease
          )

          for task in "${tasks[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              echo "Running $task (attempt $attempt of 3)"
              if timeout --signal=TERM --kill-after=1m 6m \
                "$gradle" -p "$project_dir" "$task" \
                --no-daemon --stacktrace --info; then
                uploaded=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::$task failed or timed out; retrying"
                sleep $((attempt * 10))
              fi
            done
            if [ "$uploaded" != true ]; then
              echo "::error::$task failed after 3 bounded attempts"
              exit 1
            fi
          done

      - name: Report Android release artifact sizes
        env:
          SIZE_REPORT_TITLE: Android release artifact sizes
          SIZE_REPORT_PATHS: |
            src-tauri/gen/android/app/build/outputs/apk
            src-tauri/gen/android/app/build/outputs/bundle
          SIZE_REPORT_OUTPUT: .artifacts/sentry-size-analysis/android-release-sizes.md
        run: node .github/scripts/report-artifact-sizes.mjs

      - name: Export committed source for Android SBOM
        shell: bash
        run: |
          set -euo pipefail
          sbom_source=$(mktemp -d)
          git archive HEAD | tar -x -C "$sbom_source"
          if [ "$RUNNER_OS" = Windows ]; then
            sbom_source=$(cygpath -m "$sbom_source")
          fi
          printf 'CHARM_SBOM_SOURCE=%s\n' "$sbom_source" >> "$GITHUB_ENV"

      - name: Generate Android SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.CHARM_SBOM_SOURCE }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: charm-android.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            charm-android.spdx.json
          if-no-files-found: error

      - name: Upload Android size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-size-analysis-android
          path: .artifacts/sentry-size-analysis/android-release-sizes.md
          include-hidden-files: true

      - name: Resolve Android build for Sentry size analysis
        id: android-size-build
        run: |
          outputs_dir=src-tauri/gen/android/app/build/outputs
          mapfile -t builds < <(
            find "$outputs_dir" -type f \
              \( -name '*.aab' -o -name '*.apk' \) | sort
          )
          if [ "${#builds[@]}" -eq 0 ]; then
            echo "::error::No Android APK or AAB found for Sentry size analysis"
            exit 1
          fi

          selected=""
          for build in "${builds[@]}"; do
            lower_build="${build,,}"
            if [[ "$lower_build" == *"/bundle/"* && "$lower_build" == *"release"* ]]; then
              selected="$build"
              break
            fi
          done
          if [ -z "$selected" ]; then
            for build in "${builds[@]}"; do
              if [[ "$build" == *"/apk/"* &&
                "$build" == *"universal"* &&
                "$build" == *"release"* ]]; then
                selected="$build"
                break
              fi
            done
          fi
          if [ -z "$selected" ]; then
            for build in "${builds[@]}"; do
              if [[ "$build" == *"release"* ]]; then
                selected="$build"
                break
              fi
            done
          fi
          if [ -z "$selected" ]; then
            selected="${builds[0]}"
          fi

          echo "path=$selected" >> "$GITHUB_OUTPUT"
          {
            echo "Selected Android size-analysis build:"
            echo "\`$selected\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android build to Sentry size analysis
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: >
          pnpm dlx @sentry/cli@3.5.1 build upload
          "${{ steps.android-size-build.outputs.path }}"
          --org "$SENTRY_ORG"
          --project "$SENTRY_PROJECT"
          --build-configuration Release
          --base-sha "${{ steps.sentry-size-base.outputs.sha }}"
          --log-level info

  publish-release-artifacts:
    name: Publish signed release artifacts
    concurrency:
      group: stable-release-publication-${{ github.ref }}
      cancel-in-progress: false
    needs:
      [
        frontend-sourcemaps,
        rust-linux-debug-files,
        apple-debug-files,
        windows-debug-files,
        android-debug-files,
      ]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.verify_platform_signing
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Verify complete artifact and SBOM set
        run: |
          set -euo pipefail
          for pattern in '*.deb' '*.rpm' '*.dmg' '*.msi' '*.exe' '*.apk' '*.aab' \
            'charm-linux.spdx.json' 'charm-macos.spdx.json' \
            'charm-windows.spdx.json' 'charm-android.spdx.json'; do
            if ! find artifacts -type f -name "$pattern" -print -quit | grep -q .; then
              echo "::error::Missing release asset matching $pattern"
              exit 1
            fi
          done

      - name: Generate checksums and detached signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd artifacts
          duplicate_names=$(find . -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$duplicate_names" ]; then
            echo "::error::Release asset basenames collide"
            printf '%s\n' "$duplicate_names"
            exit 1
          fi
          sha256_manifest=$(mktemp)
          sha1_manifest=$(mktemp)
          while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")")
          done < <(find . -type f -print0 | sort -z) > "$sha256_manifest"
          while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha1sum "$(basename "$file")")
          done < <(find . -type f -print0 | sort -z) > "$sha1_manifest"
          mv "$sha256_manifest" SHA256SUMS.txt
          mv "$sha1_manifest" SHA1SUMS.txt

          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Stable releases require GPG_PRIVATE_KEY"
            exit 1
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')
          # Empty passphrases deliberately support an unencrypted release key.
          # A protected key still fails closed, with an actionable error.
          mapfile -d '' to_sign < <(find . -type f -print0)
          for file in "${to_sign[@]}"; do
            if ! gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$key_id" --detach-sign --armor "$file"; then
              echo "::error::Release signing failed for $(basename "$file"). If the key is protected, configure its matching GPG_PASSPHRASE."
              exit 1
            fi
          done
          gpg --batch --armor --export "$key_id" > charm-release-signing-key.asc

      - name: Stage and verify assets before publishing the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::GitHub release $GITHUB_REF_NAME was not created in time"
              exit 1
            fi
            sleep 10
          done
          release_id=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          require_draft() {
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)" != true ]; then
              echo "::error::Refusing to modify an already-published release. Use a new version for replacement assets."
              exit 1
            fi
          }
          require_draft
          mapfile -d '' assets < <(find artifacts -type f -print0)
          for file in "${assets[@]}"; do
            name=$(basename "$file")
            expected="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            remote=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              | jq -c --arg name "$name" '.[] | select(.name == $name)')
            if [ -n "$remote" ]; then
              remote_digest=$(jq -r '.digest // empty' <<<"$remote")
              if [ -n "$remote_digest" ] && [ "$remote_digest" != "$expected" ]; then
                case "$name" in
                  charm-release-signing-key.asc)
                    echo "::error::Existing draft uses a different OpenPGP release key; refusing to mix signing identities. Repair the unpublished draft explicitly or use a new version."
                    exit 1
                    ;;
                  *.asc)
                    # Detached OpenPGP signatures include creation-time and
                    # nonce material. On a resumed draft, reuse the existing
                    # signature only after proving it validates the identical
                    # local asset with this release key.
                    signature_dir=$(mktemp -d)
                    gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                      --pattern "$name" --dir "$signature_dir"
                    export GNUPGHOME="${RUNNER_TEMP}/gnupg"
                    if ! gpg --batch --verify "$signature_dir/$name" "${file%.asc}"; then
                      echo "::error::Existing draft signature does not validate for ${name%.asc}"
                      exit 1
                    fi
                    cp "$signature_dir/$name" "$file"
                    expected="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
                    if [ "$remote_digest" != "$expected" ]; then
                      echo "::error::Downloaded draft signature digest differs for $name"
                      exit 1
                    fi
                    ;;
                  *)
                    echo "::error::Existing draft asset digest differs; refusing to overwrite $name"
                    exit 1
                    ;;
                esac
              fi
            else
              require_draft
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$file"
            fi
          done
          # Verify GitHub's complete stored set, not merely upload exit codes.
          # Asset state and digest fields are eventually consistent after an
          # upload, so allow a bounded publication window before failing.
          verified=false
          for attempt in {1..12}; do
            ready=true
            remote_count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].name' | wc -l)
            if [ "$remote_count" -ne "${#assets[@]}" ]; then
              ready=false
            fi
            for file in "${assets[@]}"; do
              name=$(basename "$file")
              expected="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
              actual=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
                | jq -r --arg name "$name" '.[] | select(.name == $name and .state == "uploaded") | .digest // empty')
              if [ -z "$actual" ]; then
                ready=false
              elif [ "$actual" != "$expected" ]; then
                echo "::error::Stored draft asset digest differs for $name"
                exit 1
              fi
            done
            if [ "$ready" = true ]; then
              verified=true
              break
            fi
            echo "Release assets are not queryable yet (attempt $attempt/12); retrying."
            sleep 5
          done
          if [ "$verified" != true ]; then
            echo "::error::Release assets did not become verifiable within 60 seconds"
            exit 1
          fi
          require_draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
