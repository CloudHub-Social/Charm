name: Migrate release signing secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Generate repository administration token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Move signing credentials into the protected environment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_NAME: ${{ secrets.MACOS_CERT_NAME }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          ANDROID_KEYSTORE_JKS: ${{ secrets.ANDROID_KEYSTORE_JKS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          names=(
            MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_CERT_NAME
            WINDOWS_CERT_PFX WINDOWS_CERT_PASSWORD
            ANDROID_KEYSTORE_JKS ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GPG_PRIVATE_KEY
          )
          for name in "${names[@]}"; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Repository secret $name is missing; refusing a partial migration"
              exit 1
            fi
          done
          for name in "${names[@]}"; do
            printf '%s' "${!name}" | gh secret set "$name" --repo "$GITHUB_REPOSITORY" --env release-signing
          done
          for name in "${names[@]}"; do
            gh secret delete "$name" --repo "$GITHUB_REPOSITORY"
          done
