name: Migrate release signing secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Encrypt signing credentials for out-of-band migration
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_NAME: ${{ secrets.MACOS_CERT_NAME }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          ANDROID_KEYSTORE_JKS: ${{ secrets.ANDROID_KEYSTORE_JKS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          gpg --batch --import .github/signing-migration-public.asc
          names=(
            MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_CERT_NAME
            WINDOWS_CERT_PFX WINDOWS_CERT_PASSWORD
            ANDROID_KEYSTORE_JKS ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GPG_PRIVATE_KEY
          )
          for name in "${names[@]}"; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Repository secret $name is missing; refusing a partial migration"
              exit 1
            fi
          done
          mkdir encrypted-signing-secrets
          for name in "${names[@]}"; do
            printf '%s' "${!name}" | gpg --batch --yes --trust-model always \
              --recipient 1534DD77C25E90E567D57F1D671A58FA847D4093 \
              --output "encrypted-signing-secrets/$name.gpg" --encrypt
          done

      - name: Upload encrypted migration bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signing-secret-migration
          path: encrypted-signing-secrets/*.gpg
          if-no-files-found: error
          retention-days: 1
