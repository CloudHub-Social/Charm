name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  eligibility:
    # Validate with read-only credentials in a separate job. A candidate prefix
    # alone must never receive the publication job's write token or App token.
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.head.ref == 'release'
          || startsWith(github.event.pull_request.head.ref, 'release-candidate-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Find the originating preparation receipt
        id: receipt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { candidateArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-candidate.mjs`);
            const artifact = await candidateArtifact({ github, context });
            if (artifact) {
              core.setOutput('artifact-id', artifact.artifactId);
              core.setOutput('run-id', artifact.runId);
            }

      - name: Download the immutable preparation receipt
        if: steps.receipt.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact-id }}
          run-id: ${{ steps.receipt.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-provenance
          merge-multiple: true
          digest-mismatch: error

      - name: Verify candidate, attempt and consumed changesets
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { execFileSync } = await import('node:child_process');
            const { verifyCandidate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-candidate.mjs`);
            const receipt = context.payload.pull_request.head.ref === 'release' ? undefined :
              JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-provenance/release-candidate.json`, 'utf8'));
            const mergeVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
            await verifyCandidate({ github, context, receipt, mergeVersion });
            execFileSync(process.execPath, ['scripts/validate-changeset-packages.mjs', '--expect-consumed'], { stdio: 'inherit' });
            core.setOutput('eligible', 'true');

  release:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: true
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - name: Reject unconsumed changesets before creating a tag
        run: node scripts/validate-changeset-packages.mjs --expect-consumed

      - name: Create draft release and trigger tagged builds
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' package.json)
          # Android versionCode derivation intentionally accepts stable SemVer
          # only. Reject prereleases before creating either a tag or a draft so
          # an unsupported release cannot leave partially published state.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          git check-ref-format "refs/tags/$tag"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag "$tag" "$RELEASE_COMMIT"
          fi
          # Create a missing ref with GITHUB_TOKEN, whose events cannot
          # recursively start release-builds. The explicit dispatch below is
          # therefore the single build trigger for both new and resumed tags.
          if ! git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            GH_TOKEN="$WORKFLOW_TOKEN" gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$RELEASE_COMMIT"
          fi
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$RELEASE_COMMIT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$RELEASE_COMMIT" --title "$tag" --generate-notes
          fi
          gh workflow run release-builds.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
