name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  release:
    # Only the generated release branch in this repository may publish. A
    # fork can also name its source branch `release`; head.ref alone would
    # grant that unrelated merged PR the release job's write credentials.
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'release'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: true
          token: ${{ steps.generate-token.outputs.token }}

      - name: Create draft release and trigger tagged builds
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' package.json)
          tag="v$version"
          git check-ref-format "refs/tags/$tag"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag "$tag" "$RELEASE_COMMIT"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            prerelease=()
            if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$RELEASE_COMMIT" --title "$tag" --generate-notes "${prerelease[@]}"
          fi
          # Push only after the draft exists. The app token triggers tagged
          # platform builds; the publisher alone makes the draft public.
          git push origin "refs/tags/$tag"
