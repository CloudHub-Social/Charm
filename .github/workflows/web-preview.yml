name: Web preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect web-affecting changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether the web build's inputs changed
        id: filter
        run: node scripts/ci/selection.mjs web

  mark-stale-preview:
    name: Mark existing preview comment stale
    needs: changes
    # A PR that already has a preview comment from an earlier, web-affecting
    # revision, then gets a later push that removes/reverts those changes,
    # would otherwise leave that comment's URL silently pointing at a stale
    # deployed bundle — nothing else in this workflow runs to update it once
    # `deploy` is skipped.
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Note that the preview no longer reflects the current diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- charm-web-preview -->"
          stale_note="_No web-affecting changes in the latest revision — this preview reflects an earlier commit._"
          id=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\")) and (.body | contains(\"${stale_note}\") | not)) | .id" \
            | tail -n 1)
          [ -z "$id" ] && exit 0
          body=$(gh api "repos/${{ github.repository }}/issues/comments/${id}" --jq .body)
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${id}" \
            -f body="$(printf '%s\n\n%s' "$body" "$stale_note")"

  deploy:
    name: Cloudflare Worker preview
    needs: changes
    # workflow_dispatch has no "changed files" concept, so it always deploys.
    # A skipped required-adjacent check here is fine — this isn't a required
    # status check, just an informational preview link.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHARM_WEB_API_BASE_URL: ${{ secrets.CHARM_WEB_API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check preview configuration
        id: config
        run: |
          # VITE_SENTRY_DSN is deliberately not in this required list — it's
          # a public client key that only enables optional runtime Sentry
          # reporting (no source-map upload/token path here, see below), so
          # a missing/rotated DSN shouldn't block publishing the preview.
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CHARM_WEB_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::notice::Skipping web preview; missing secret(s): %s\n' "${missing[*]}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Deliberately does NOT run configure-sentry-release-env.sh /
      # SENTRY_UPLOAD=true here, unlike web-deploy-dev.yml. That would put
      # SENTRY_AUTH_TOKEN (a write-capable API token) in the environment
      # during the composite action's `pnpm install`/`pnpm build:web` steps
      # below — and those run on `pull_request`, which (unlike
      # web-deploy-dev.yml's `push`-to-main trigger) executes PR-controlled
      # lockfile/build-config content before human review. A compromised
      # transitive dependency's postinstall script could exfiltrate the
      # token. VITE_SENTRY_DSN is a public client key (it ships in the
      # browser bundle regardless), so preview deploys still get runtime
      # Sentry error reporting — they just skip source-map upload and
      # release tagging, which need the token.
      #
      # The build id (Spec 24), unlike the Sentry upload token, is not a
      # secret and carries no risk of exfiltration, so it's computed and
      # exposed here unconditionally — this is what lets a PR preview build's
      # AboutPanel show `{version}+pr{number}.{short_sha}` even though this
      # job never touches SENTRY_AUTH_TOKEN. Node is set up here (rather than
      # relying on the composite action's own setup-node, which runs later)
      # so this step can call the shared script directly.
      - if: steps.config.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Compute build id
        if: steps.config.outputs.enabled == 'true'
        env:
          # github.event.pull_request.head.sha (NOT github.sha/GITHUB_SHA) —
          # on `pull_request` events GITHUB_SHA resolves to a synthetic
          # merge-ref commit, not the commit this preview actually contains.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_KIND: ${{ github.event.pull_request.number && 'pr' || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/compute-build-id.mjs

      - if: steps.config.outputs.enabled == 'true'
        uses: ./.github/actions/build-web-worker
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: preview
        with:
          worker-name: charm-preview
          bundle-dir: preview-worker
          charm-web-api-base-url: ${{ env.CHARM_WEB_API_BASE_URL }}
          workers-dev: "true"

      - name: Deploy to Cloudflare Workers
        if: steps.config.outputs.enabled == 'true'
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref_slug=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-')
          ref_slug=${ref_slug#-}
          ref_slug=${ref_slug%-}
          ref_slug=${ref_slug:-manual}
          ref_slug=${ref_slug:0:40}
          preview_alias="manual-${ref_slug}"
          if [ -n "$PR_NUMBER" ]; then
            preview_alias="pr-${PR_NUMBER}"
          fi
          # npx, not pnpm dlx: pnpm 10 blocks dependency build/postinstall
          # scripts by default, and wrangler's own deps (esbuild, sharp,
          # workerd) need theirs to actually function — `pnpm dlx wrangler`
          # fails with ERR_PNPM_IGNORED_BUILDS before wrangler even runs.
          # Confirmed empirically (see PR #136 CI run 29100250953).
          if ! npx --yes wrangler@4.107.1 versions list --name charm-preview >/dev/null 2>&1; then
            npx --yes wrangler@4.107.1 deploy --config preview-worker/wrangler.jsonc >/dev/null
          fi
          npx --yes wrangler@4.107.1 versions upload \
            --config preview-worker/wrangler.jsonc \
            --preview-alias "$preview_alias" \
            | tee wrangler-output.txt
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' wrangler-output.txt | tail -n 1)
          if [ -z "$url" ]; then
            echo "::error::Wrangler did not print a workers.dev deployment URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed API proxy
        if: steps.config.outputs.enabled == 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if ! status=$(curl --silent --show-error --output /tmp/charm-preview-proxy.txt --write-out "%{http_code}" "${PREVIEW_URL}/api/auth/me"); then
            echo "::error::Failed to connect to deployed preview API proxy."
            cat /tmp/charm-preview-proxy.txt
            exit 1
          fi
          case "$status" in
            401)
              ;;
            403)
              echo "::error::Preview API proxy returned 403 for /api/auth/me. Expected unauthenticated companion API response is 401."
              cat /tmp/charm-preview-proxy.txt
              exit 1
              ;;
            404)
              echo "::error::Preview API proxy returned 404 for /api/auth/me. The Worker preview proxy is likely missing or not routing."
              cat /tmp/charm-preview-proxy.txt
              exit 1
              ;;
            502)
              echo "::error::Preview API proxy returned 502. Ensure CHARM_WEB_API_BASE_URL points at the companion server origin."
              cat /tmp/charm-preview-proxy.txt
              exit 1
              ;;
            5*)
              echo "::error::Preview API proxy returned HTTP ${status}."
              cat /tmp/charm-preview-proxy.txt
              exit 1
              ;;
            *)
              echo "::error::Preview API proxy returned HTTP ${status}; expected 401 from unauthenticated /api/auth/me."
              cat /tmp/charm-preview-proxy.txt
              exit 1
              ;;
          esac

      - name: Comment preview URL
        if: steps.config.outputs.enabled == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set +e
          marker="<!-- charm-web-preview -->"
          body=$(printf "%s\nWeb preview: %s\n\nBuilt with \`%s\` and a same-origin \`%s\` Worker proxy so Strict session cookies work in authenticated preview flows." \
            "$marker" \
            "$PREVIEW_URL" \
            "VITE_CHARM_BUILD_TARGET=web" \
            "/api/*")
          existing=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
            | tail -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" -f body="$body"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="$body"
          fi
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Preview deployed, but GitHub Actions could not post the PR comment with the preview URL."
          fi
