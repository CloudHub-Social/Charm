name: CI selection evidence

on:
  pull_request:
    paths:
      - scripts/ci/**
      - .github/workflows/ci-selection-evidence.yml
      - .github/workflows/ios-release-evidence.yml
      - .github/workflows/web-preview.yml

  workflow_dispatch:
    inputs:
      historical_replay:
        description: Replay retained Quality40699404196 evidence (requires historical objects and run metadata)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-selection-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate merge selection and stale-base witness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
      - run: node --test scripts/ci/*.test.mjs

  historical-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.historical_replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Replay exact historical stale-base merge and provider timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/replay-stale-base.mjs
