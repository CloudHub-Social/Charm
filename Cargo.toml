[workspace]
resolver = "2"
members = ["src-tauri", "crates/charm-web-server"]

# Tao 0.35.3 returns a pointer to an already-dropped UISceneConfiguration on
# iOS and lazily registers its scene delegate after UIKit tries to resolve the
# static Info.plist entry. Pin the two minimal 0.35.x backports until a
# compatible release exists. The fork commit is based directly on the upstream
# lifetime fix and adds the early registration already present on Tao's dev
# branch in a3ff3f035f3f5886a45af0533532e568ca57e91b.
# https://github.com/tauri-apps/tao/pull/1245
[patch.crates-io]
tao = { git = "https://github.com/Just-Insane/tao", rev = "b3c73f064541011f6a99704982485a662d6b0561" }

# `src-tauri` remains buildable standalone (`cd src-tauri && cargo build`) —
# Tauri's CLI expects to run from that directory. This root manifest only
# adds a shared `Cargo.lock` / build graph for the workspace as a whole; it
# intentionally carries no `[workspace.dependencies]` yet so neither member's
# existing dependency declarations need to change.
